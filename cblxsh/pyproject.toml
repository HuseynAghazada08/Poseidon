[project]
name = "poseidon-aqms"
version = "0.1.0"
description = "Maritime Vessel Traffic Monitor - North Sea & Baltic"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135",
    "pandas>=2.2",
    "plotly>=6.0",
    "pyarrow>=18.0",
    "pydantic>=2.12",
    "uvicorn[standard]>=0.42",
]

[project.scripts]
start = "poseidon.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poseidon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=poseidon --cov-report=term-missing"

[tool.coverage.run]
source = ["poseidon"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
ignore_missing_imports = true
